[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caricature-mvp"
version = "0.1.0"
description = "Object-agnostic line-drawing caricatures with FLUX.2 Klein"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.2",
  "diffusers>=0.36.0",
  "gradio>=5.0",
  "pillow>=10.0",
  "pydantic>=2.7",
  "safetensors>=0.4",
  "torch>=2.4",
  "transformers>=4.57",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
caricature-mvp = "caricature_mvp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caricature_mvp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["flux_smoke: downloads and runs the real FLUX model"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
